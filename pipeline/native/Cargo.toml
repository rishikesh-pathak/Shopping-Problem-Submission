[package]
name = "shopping-native"
version = "0.1.0"
edition = "2021"

[dependencies]
ahash = "0.8.12"
hashbrown = { version = "0.16.1", features = ["raw-entry"] }
memchr = "2.7"
memmap2 = "0.9"
parquet = { version = "57", default-features = false, features = ["snap"] }
rayon = "1.11"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
