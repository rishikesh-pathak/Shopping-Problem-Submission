name: Refresh locked hashbrown feature
on:
  push:
    branches: [perf/cached-id-hashes]
  workflow_dispatch:
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh existing locked dependencies
        run: |
          cargo check --manifest-path pipeline/native/Cargo.toml
          python3 - <<'PY'
          import json
          print('LOCK_JSON='+json.dumps(open('pipeline/native/Cargo.lock').read()))
          PY
